# dataset definitions for src/make_data.py
# never edit an entry after data has been generated from it; add a new entry instead
output_root: data/synthetic
datasets:
  # phase 0: single-hop grokking baseline
  - name: p113_h1
    p: 113
    ops: ["+"]
    max_train_hops: 1
    max_test_hops: 1
    seed: 0
    hop1: {train_frac: 0.30, val_frac: 0.10}
    multihop: {train_per_hop: 15000, val_per_hop: 2000, max_space_frac: 0.5}
    extrap: {per_hop: 2000}
    systematic: {per_hop: 2000}

  # phase 1: train on hops 1..3, evaluate depth extrapolation up to 6
  - name: p113_h3_x6
    p: 113
    ops: ["+"]
    max_train_hops: 3
    max_test_hops: 6
    seed: 0
    hop1: {train_frac: 0.30, val_frac: 0.10}
    multihop: {train_per_hop: 15000, val_per_hop: 2000, max_space_frac: 0.5}
    extrap: {per_hop: 2000}
    systematic: {per_hop: 2000}
