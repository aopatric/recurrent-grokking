# run definitions for src/train.py
# never edit an entry after a run exists; add a new entry instead
# widths (d_model, num_heads, d_head, d_mlp) and optim default to nanda's settings
output_root: runs
data_root: data/synthetic
runs:
  # nanda anchor, canonical single-hop grokking run
  - name: anchor_p113_h1
    data: p113_h1
    seed: 0
    model: {pos: learned, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 1}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 1}

  # nanda anchor on multi-hop data; learned positions, so only hops 1-3 are meaningful
  - name: anchor_p113_h3_x6
    data: p113_h3_x6
    seed: 0
    model: {pos: learned, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 1}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 1}

  # same anchor without positions (identical to the ut at T = 1), for valid extrapolation
  - name: anchor_nope_p113_h3_x6
    data: p113_h3_x6
    seed: 0
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 1}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 1}

  # universal transformer: one shared layer looped 8 times
  - name: ut_k1_T8_p113_h3_x6
    data: p113_h3_x6
    seed: 0
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # unshared baseline at the ut's compute: 8 distinct layers
  - name: unshared_k1_L8_p113_h3_x6
    data: p113_h3_x6
    seed: 0
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: false,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 8}

  # huginn with huginn's sampled depth prior
  - name: huginn_sampled_k1_p113_h3_x6
    data: p113_h3_x6
    seed: 0
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # ut with an rms norm on the carried state, for stability at large T
  - name: ut_statenorm_k1_T8_p113_h3_x6
    data: p113_h3_x6
    seed: 0
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0, state_norm: true}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # huginn at half the weight decay: if the collapse cycles come from weight decay raising the
  # effective learning rate of normalized weights, their period should roughly double
  - name: huginn_sampled_wd05_k1_p113_h3_x6
    data: p113_h3_x6
    seed: 0
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    optim: {weight_decay: 0.5}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # huginn with no weight decay on the rms norm gains
  - name: huginn_sampled_gainsnowd_k1_p113_h3_x6
    data: p113_h3_x6
    seed: 0
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    optim: {no_decay: [w_rms]}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # ablation suite: every run at seeds 41, 42 and 43, judged at 20k steps with suite.py --until
  # and resumed toward 40k when it is still improving; names are <tier>_<model>_<change>_<data>_s<seed>.
  # the seed sets the initial weights, the depth draws and the random starts; every run shares the
  # dataset's one train/val split, which comes from the data config's own seed

  # one layer, no positions, one pass: the non-looped model that groks
  - name: t1_anchor_nope_ref_p113_h3_x6_s41
    data: p113_h3_x6
    seed: 41
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 1}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 1}
  - name: t1_anchor_nope_ref_p113_h3_x6_s42
    data: p113_h3_x6
    seed: 42
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 1}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 1}
  - name: t1_anchor_nope_ref_p113_h3_x6_s43
    data: p113_h3_x6
    seed: 43
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 1}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 1}

  # universal transformer: the same layer looped 8 times
  - name: t1_ut_ref_p113_h3_x6_s41
    data: p113_h3_x6
    seed: 41
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_ut_ref_p113_h3_x6_s42
    data: p113_h3_x6
    seed: 42
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_ut_ref_p113_h3_x6_s43
    data: p113_h3_x6
    seed: 43
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # 8 distinct layers at the looped model's depth: depth without weight sharing
  - name: t1_unshared_L8_p113_h3_x6_s41
    data: p113_h3_x6
    seed: 41
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: false,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 8}
  - name: t1_unshared_L8_p113_h3_x6_s42
    data: p113_h3_x6
    seed: 42
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: false,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 8}
  - name: t1_unshared_L8_p113_h3_x6_s43
    data: p113_h3_x6
    seed: 43
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: false,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 8}

  # looped model plus huginn's rms sandwich norms (block, state and output norms)
  - name: t1_ut_sandwich_p113_h3_x6_s41
    data: p113_h3_x6
    seed: 41
    model: {pos: none, norm: rms_sandwich, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_ut_sandwich_p113_h3_x6_s42
    data: p113_h3_x6
    seed: 42
    model: {pos: none, norm: rms_sandwich, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_ut_sandwich_p113_h3_x6_s43
    data: p113_h3_x6
    seed: 43
    model: {pos: none, norm: rms_sandwich, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # looped model plus concat injection of the embedded input each pass
  - name: t1_ut_inject_p113_h3_x6_s41
    data: p113_h3_x6
    seed: 41
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: concat, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_ut_inject_p113_h3_x6_s42
    data: p113_h3_x6
    seed: 42
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: concat, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_ut_inject_p113_h3_x6_s43
    data: p113_h3_x6
    seed: 43
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: concat, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # huginn recipe: sandwich norms, prelude and coda, concat injection, random start, sampled depth, truncated backprop
  - name: t1_huginn_ref_p113_h3_x6_s41
    data: p113_h3_x6
    seed: 41
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_huginn_ref_p113_h3_x6_s42
    data: p113_h3_x6
    seed: 42
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_huginn_ref_p113_h3_x6_s43
    data: p113_h3_x6
    seed: 43
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # huginn without the prelude and coda layers
  - name: t1_huginn_noprecoda_p113_h3_x6_s41
    data: p113_h3_x6
    seed: 41
    model: {pos: none, norm: rms_sandwich, n_prelude: 0, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 0}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_huginn_noprecoda_p113_h3_x6_s42
    data: p113_h3_x6
    seed: 42
    model: {pos: none, norm: rms_sandwich, n_prelude: 0, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 0}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_huginn_noprecoda_p113_h3_x6_s43
    data: p113_h3_x6
    seed: 43
    model: {pos: none, norm: rms_sandwich, n_prelude: 0, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 0}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # huginn starting the loop from the embedding instead of noise
  - name: t1_huginn_embedstart_p113_h3_x6_s41
    data: p113_h3_x6
    seed: 41
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: embed, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_huginn_embedstart_p113_h3_x6_s42
    data: p113_h3_x6
    seed: 42
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: embed, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_huginn_embedstart_p113_h3_x6_s43
    data: p113_h3_x6
    seed: 43
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: embed, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # huginn without injection (so it also starts from the embedding)
  - name: t1_huginn_noinject_p113_h3_x6_s41
    data: p113_h3_x6
    seed: 41
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_huginn_noinject_p113_h3_x6_s42
    data: p113_h3_x6
    seed: 42
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_huginn_noinject_p113_h3_x6_s43
    data: p113_h3_x6
    seed: 43
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # huginn at a fixed depth of 8, keeping the truncated backprop window
  - name: t1_huginn_fixedT8_p113_h3_x6_s41
    data: p113_h3_x6
    seed: 41
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 1}
    depth: {rule: fixed, T: 8, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_huginn_fixedT8_p113_h3_x6_s42
    data: p113_h3_x6
    seed: 42
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 1}
    depth: {rule: fixed, T: 8, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_huginn_fixedT8_p113_h3_x6_s43
    data: p113_h3_x6
    seed: 43
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 1}
    depth: {rule: fixed, T: 8, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # huginn with depth draws below 2 raised to 2; otherwise the same draws as huginn
  - name: t1_huginn_mindepth2_p113_h3_x6_s41
    data: p113_h3_x6
    seed: 41
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, min_depth: 2, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_huginn_mindepth2_p113_h3_x6_s42
    data: p113_h3_x6
    seed: 42
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, min_depth: 2, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t1_huginn_mindepth2_p113_h3_x6_s43
    data: p113_h3_x6
    seed: 43
    model: {pos: none, norm: rms_sandwich, n_prelude: 1, k: 1, core_shared: true,
            injection: concat, state_init: random, n_coda: 1}
    depth: {rule: sampled, mean: 8, sigma: 0.5, cap: 24, min_depth: 2, grad_iters: 4}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # looped model with an rms norm on the carried state only
  - name: t2_ut_statenorm_ref_p113_h3_x6_s41
    data: p113_h3_x6
    seed: 41
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0, state_norm: true}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t2_ut_statenorm_ref_p113_h3_x6_s42
    data: p113_h3_x6
    seed: 42
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0, state_norm: true}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t2_ut_statenorm_ref_p113_h3_x6_s43
    data: p113_h3_x6
    seed: 43
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0, state_norm: true}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # looped model with only 2 passes
  - name: t2_ut_T2_p113_h3_x6_s41
    data: p113_h3_x6
    seed: 41
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 2}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t2_ut_T2_p113_h3_x6_s42
    data: p113_h3_x6
    seed: 42
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 2}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t2_ut_T2_p113_h3_x6_s43
    data: p113_h3_x6
    seed: 43
    model: {pos: none, norm: none, n_prelude: 0, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 0}
    depth: {rule: fixed, T: 2}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}

  # looped model plus a prelude and a coda layer
  - name: t2_ut_precoda_p113_h3_x6_s41
    data: p113_h3_x6
    seed: 41
    model: {pos: none, norm: none, n_prelude: 1, k: 1, core_shared: true,
            injection: none, state_init: embed, n_coda: 1}
    depth: {rule: fixed, T: 8}
    train: {steps: 40000, eval_every: 100, sweep_every: 1000, eval_T_max: 32}
  - name: t2_ut_precoda_p113_h3_x6_s42
    data: p113_h3_x6
    seed: 42
    model: {pos: none, norm: none, n_prelude: 1, k: 1, core_shared: true,
