[project]
name = "time-loops"
version = "0.1.0"
description = "The clock algorithm in looped transformers: how recurrent-depth models learn single- and multi-hop modular addition."
requires-python = ">=3.12,<3.13"
dependencies = [
    "einops>=0.8.2",
    "numpy>=2.5.4",
    "pyyaml>=6.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "datasets>=3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
