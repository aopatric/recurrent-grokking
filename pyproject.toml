[project]
name = "loop-level-patching"
version = "0.1.0"
description = "Activation patching at the level of loop iterations in recurrent-depth transformers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "datasets>=3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
